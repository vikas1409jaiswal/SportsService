services:
  # CricketService API container
  cricketservice-api:
    build:
      context: .
      dockerfile: CricketService.Api/Dockerfile
    container_name: cricketservice-api
    ports:
      - "${API_PORT_MAP}"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - PostgresServer__ConnectionString=${API_POSTGRES_CONN}
      - Hangfire__DatabaseConnectionString=${API_HANGFIRE_CONN}
    depends_on:
      - cricket-service-database
      - hangfire-database

  # new db container on port 5440
  cricket-service-database:
    image: postgres:latest
    container_name: cricket-info-service-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${CRICKET_DB_PORT_MAP}"  # Maps host port 5440 to container port 5432
    volumes:
      - cricket-info-service-db:/var/lib/postgresql
    restart: unless-stopped

  # hangfire db container on port 5441
  hangfire-database:
    image: postgres:latest
    container_name: hangfire-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${HANGFIRE_USER}
      POSTGRES_PASSWORD: ${HANGFIRE_PASSWORD}
      POSTGRES_DB: ${HANGFIRE_DB}
    ports:
      - "${HANGFIRE_DB_PORT_MAP}"  # Maps host port 5441 to container port 5432
    volumes:
      - hangfire-db:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
  cricket-info-service-db:
  hangfire-db: